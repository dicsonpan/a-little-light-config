<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一点光 · 设备配置</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ============================================================
     登录 / 注册页面
     ============================================================ -->
<div id="auth-page" class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="authLightGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFFEF0"/>
                        <stop offset="15%" stop-color="#FFE082"/>
                        <stop offset="35%" stop-color="#FFB74D"/>
                        <stop offset="60%" stop-color="#FF8C42" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="authBgGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#1a1f2e"/>
                        <stop offset="100%" stop-color="#0a0f1a"/>
                    </radialGradient>
                </defs>
                <circle cx="28" cy="28" r="27" fill="url(#authBgGrad)"/>
                <circle cx="28" cy="28" r="27" fill="none" stroke="#2a3040" stroke-width="0.5"/>
                <circle cx="11" cy="13" r="0.9" fill="#FFFFFF" opacity="0.7"/>
                <circle cx="46" cy="15" r="0.6" fill="#FFFFFF" opacity="0.4"/>
                <circle cx="9" cy="40" r="0.5" fill="#FFFFFF" opacity="0.3"/>
                <circle cx="47" cy="42" r="0.7" fill="#FFFFFF" opacity="0.5"/>
                <circle cx="42" cy="9" r="0.4" fill="#FFFFFF" opacity="0.3"/>
                <circle cx="14" cy="48" r="0.4" fill="#FFFFFF" opacity="0.25"/>
                <line x1="28" y1="4" x2="28" y2="8" stroke="#FFD66B" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
                <line x1="28" y1="48" x2="28" y2="52" stroke="#FFD66B" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
                <line x1="4" y1="28" x2="8" y2="28" stroke="#FFD66B" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
                <line x1="48" y1="28" x2="52" y2="28" stroke="#FFD66B" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
                <circle cx="28" cy="28" r="22" fill="url(#authLightGlow)" opacity="0.2"/>
                <circle cx="28" cy="28" r="15" fill="url(#authLightGlow)" opacity="0.5"/>
                <circle cx="28" cy="28" r="10" fill="url(#authLightGlow)"/>
                <circle cx="28" cy="28" r="3.5" fill="#FFFEF0"/>
            </svg>
        </div>
        <h1 class="auth-title">一点光</h1>
        <p class="auth-subtitle">家庭设备配置中心</p>

        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">登录</button>
            <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="auth-form" onsubmit="return false;">
            <div class="form-field">
                <label for="login-email">邮箱</label>
                <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" placeholder="至少 6 位" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn" onclick="handleLogin()">登录</button>
        </form>

        <!-- 注册表单 -->
        <form id="register-form" class="auth-form hidden" onsubmit="return false;">
            <div class="form-field">
                <label for="register-email">邮箱</label>
                <input type="email" id="register-email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="register-password">密码</label>
                <input type="password" id="register-password" placeholder="至少 6 位" autocomplete="new-password" required>
            </div>
            <div class="form-field">
                <label for="register-confirm">确认密码</label>
                <input type="password" id="register-confirm" placeholder="再输入一次" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="register-btn" onclick="handleRegister()">注册</button>
        </form>

        <div id="auth-error" class="auth-error hidden"></div>
    </div>
</div>

<!-- ============================================================
     主界面 · 仪表盘
     ============================================================ -->
<div id="app-page" class="app-page hidden">
    <!-- 顶部栏 -->
    <header class="app-header">
        <div class="header-left">
            <div class="header-logo">
                <svg width="28" height="28" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="headerLightGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#FFFEF0"/>
                            <stop offset="20%" stop-color="#FFE082"/>
                            <stop offset="45%" stop-color="#FFB74D"/>
                            <stop offset="75%" stop-color="#FF8C42" stop-opacity="0.4"/>
                            <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
                        </radialGradient>
                        <radialGradient id="headerBgGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#1a1f2e"/>
                            <stop offset="100%" stop-color="#0a0f1a"/>
                        </radialGradient>
                    </defs>
                    <circle cx="28" cy="28" r="27" fill="url(#headerBgGrad)"/>
                    <circle cx="28" cy="28" r="20" fill="url(#headerLightGlow)" opacity="0.25"/>
                    <circle cx="28" cy="28" r="14" fill="url(#headerLightGlow)" opacity="0.55"/>
                    <circle cx="28" cy="28" r="9" fill="url(#headerLightGlow)"/>
                    <circle cx="28" cy="28" r="3.5" fill="#FFFEF0"/>
                </svg>
            </div>
            <span class="header-title">一点光</span>
        </div>
        <div class="header-right">
            <span id="user-email" class="user-email"></span>
            <button class="btn btn-ghost btn-sm" onclick="handleLogout()">退出</button>
        </div>
    </header>

    <main class="app-main">
        <!-- Tab 导航 -->
        <div class="tab-nav">
            <button id="tab-devices" class="tab-nav-btn active" onclick="switchMainTab('devices')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="5" y="2" width="14" height="20" rx="2"/>
                    <line x1="12" y1="18" x2="12" y2="18"/>
                </svg>
                设备管理
            </button>
            <button id="tab-connections" class="tab-nav-btn" onclick="switchMainTab('connections')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="6" r="3"/>
                    <circle cx="18" cy="18" r="3"/>
                    <line x1="9" y1="11" x2="15" y2="7"/>
                    <line x1="9" y1="13" x2="15" y2="17"/>
                </svg>
                通信关系
            </button>
        </div>

        <!-- ==================== 设备管理 Tab ==================== -->
        <section id="panel-devices" class="tab-panel">
            <div class="panel-header">
                <h2 class="panel-title">我的设备</h2>
                <button class="btn btn-primary btn-sm" onclick="openDeviceModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加设备
                </button>
            </div>

            <div id="device-list" class="device-grid">
                <!-- 设备卡片由 JS 动态生成 -->
                <div class="loading-spinner">加载中...</div>
            </div>
        </section>

        <!-- ==================== 通信关系 Tab ==================== -->
        <section id="panel-connections" class="tab-panel hidden">
            <div class="panel-header">
                <h2 class="panel-title">设备通信关系</h2>
            </div>

            <!-- 添加连接 -->
            <div class="connection-builder">
                <h3 class="section-title">新建连接</h3>
                <div class="connection-form">
                    <select id="link-device-a" class="select-input">
                        <option value="">选择设备 A</option>
                    </select>
                    <div class="connection-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF8C42" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12,5 19,12 12,19"/>
                        </svg>
                    </div>
                    <select id="link-device-b" class="select-input">
                        <option value="">选择设备 B</option>
                    </select>
                    <button class="btn btn-primary" onclick="createLink()">连接</button>
                </div>
            </div>

            <!-- 已有连接列表 -->
            <div class="connection-list-section">
                <h3 class="section-title">已有连接</h3>
                <div id="connection-list" class="connection-list">
                    <div class="loading-spinner">加载中...</div>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- ============================================================
     设备编辑弹窗
     ============================================================ -->
<div id="device-modal" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <h3 id="device-modal-title">添加设备</h3>
            <button class="modal-close" onclick="closeDeviceModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="device-form" onsubmit="return false;">
                <input type="hidden" id="device-id">

                <div class="form-field">
                    <label for="device-code">设备ID <span class="required">*</span></label>
                    <input type="text" id="device-code" placeholder="如 K7M3PQ" maxlength="6" required>
                    <p class="form-hint">三击设备蓝色按钮查看设备ID，创建后不可修改</p>
                </div>

                <div class="form-field">
                    <label for="device-display-name">显示名称 <span class="required">*</span></label>
                    <input type="text" id="device-display-name" placeholder="如 妈妈、哥哥" maxlength="20" required>
                </div>

                <div class="form-field">
                    <label for="device-role">角色 <span class="required">*</span></label>
                    <select id="device-role">
                        <!-- 选项由 JS 填充 -->
                    </select>
                    <p class="form-hint">角色决定设备上显示的头像</p>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="device-timezone">时区</label>
                        <select id="device-timezone">
                            <!-- 选项由 JS 填充 -->
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="device-city">城市</label>
                        <input type="text" id="device-city" placeholder="如 Shanghai" maxlength="50">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="device-lat">纬度</label>
                        <input type="number" id="device-lat" step="0.0001" placeholder="31.2304">
                    </div>
                    <div class="form-field">
                        <label for="device-lon">经度</label>
                        <input type="number" id="device-lon" step="0.0001" placeholder="121.4737">
                    </div>
                </div>

                <p class="form-hint">
                    <a href="https://www.openstreetmap.org" target="_blank" class="link-hint">在 OpenStreetMap 查找坐标 &rarr;</a>
                </p>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeDeviceModal()">取消</button>
            <button class="btn btn-danger hidden" id="device-delete-btn" onclick="deleteDevice()">删除</button>
            <button class="btn btn-primary" id="device-save-btn" onclick="saveDevice()">保存</button>
        </div>
    </div>
</div>

<!-- ============================================================
     Toast 通知
     ============================================================ -->
<div id="toast-container" class="toast-container"></div>

<!-- ============================================================
     脚本
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>

</body>
</html>
